top password?” What should the RAG application do next?",options:[{key:"A",text:"Generate an answer immediately without searching"},{key:"B",text:"Embed the question and search the knowledge index for relevant guidance"},{key:"C",text:"Fine-tune the LLM using the employee’s question"},{key:"D",text:"Re-index every IT document before answering"}],correctAnswer:"B",explanation:"At query time, the system represents the question as an embedding and searches for relevant evidence. Re-indexing and fine-tuning are not required for every request."},{id:3,points:1,question:"An employee searches for “I forgot my login credentials.” Which article should semantic search consider the most relevant?",options:[{key:"A",text:"Resetting a forgotten password"},{key:"B",text:"Requesting a replacement laptop"},{key:"C",text:"Connecting to office Wi-Fi"},{key:"D",text:"Booking a meeting room"}],correctAnswer:"A",explanation:"Embeddings can connect different wording with similar meaning. “Forgot my login credentials” and “resetting a forgotten password” express closely related intent."},{id:4,points:1,question:"An employee asks, “How do I connect to the company VPN from home?” Which source should the system prioritize?",options:[{key:"A",text:"VPN Setup Guide 2023: Install LegacyVPN and connect using your employee ID"},{key:"B",text:"VPN Setup Guide 2026: Install SecureConnect and sign in using company SSO and MFA"},{key:"C",text:"Office Wi-Fi Guide 2026: Select the corporate wireless network when in the office"},{key:"D",text:"Laptop Ordering Guide 2026: Laptop requests require manager approval"}],correctAnswer:"B",explanation:"The 2026 VPN guide is both relevant and current. Semantic similarity alone is insufficient when an older document contains similar wording."},{id:5,points:1,question:"The assistant tells an employee to install LegacyVPN. The current 2026 guide exists in the index, but the retriever selected the 2023 guide. The LLM correctly answered using that retrieved guide. Where did the primary failure occur?",options:[{key:"A",text:"Generation"},{key:"B",text:"Retrieval"},{key:"C",text:"Model size"},{key:"D",text:"User-interface design"}],correctAnswer:"B",explanation:"The model received outdated evidence and generated an answer from it. The main failure occurred during retrieval, not generation."},{id:6,points:1,question:"What is the best way to reduce the chance of an outdated VPN guide being selected again?",options:[{key:"A",text:"Increase the LLM temperature"},{key:"B",text:"Store version, effective date, and document status as metadata and use them during retrieval"},{key:"C",text:"Make the prompt significantly longer"},{key:"D",text:"Store the entire IT handbook as one chunk"}],correctAnswer:"B",explanation:"Metadata allows the application to filter or rank by status, version, and effective date, helping it prioritize the current approved document."},{id:7,points:1,question:"A VPN guide states: “Employees must sign in using company SSO. MFA verification is required before the VPN connection can be established.” Which chunking approach is best?",options:[{key:"A",text:"Keep both sentences together in one coherent chunk"},{key:"B",text:"Store the SSO sentence in one chunk and place the MFA requirement in an unrelated chunk"},{key:"C",text:"Store the entire 150-page IT handbook as one chunk"},{key:"D",text:"Remove the MFA sentence because it makes the chunk longer"}],correctAnswer:"A",explanation:"The instruction and its essential security requirement belong together. Separating them could cause the system to retrieve an incomplete procedure."},{id:8,points:1,question:"The correct VPN troubleshooting article appears as search result number 6, but the application retrieves only the top 5 results. What could happen?",options:[{key:"A",text:"The article will automatically be sent to the LLM"},{key:"B",text:"The article may not reach the LLM at all"},{key:"C",text:"The LLM will automatically increase top-k"},{key:"D",text:"The embedding model will generate the answer directly"}],correctAnswer:"B",explanation:"With top-k set to 5, a result ranked sixth is excluded from the prompt unless retrieval, filtering, or reranking improves its position."},{id:9,points:1,question:`The assistant retrieves this context:
