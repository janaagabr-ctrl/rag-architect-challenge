B",explanation:"RAG retrieves relevant external knowledge when the request is made and supplies that context to the LLM. It does not permanently modify the model’s weights."},{id:2,topic:"Indexing vs query pipeline",points:1,context:[{type:"text",text:"Before employees start asking questions, the company wants to prepare its IT documentation for RAG."}],question:"Which sequence belongs to the indexing pipeline?",options:R("User question → Retrieve → Prompt → Generate","Documents → Clean/split → Embed → Store in index","Question → LLM → Chunk → Answer","Documents → LLM → Fine-tune → Vector search"),correctAnswer:"B",explanation:"The indexing pipeline prepares knowledge in advance by processing documents, splitting them into chunks, creating embeddings, and storing those chunks in the index."},{id:3,topic:"Parsing",points:1,context:[{type:"text",text:"An important troubleshooting procedure exists only inside a scanned PDF."},{type:"text",text:"The normal text extractor returns almost no usable text."}],question:"What is the best next step?",options:R("Increase top-k","Use OCR to extract the scanned text","Increase the LLM temperature","Create smaller chunks from the empty output"),correctAnswer:"B",explanation:"OCR is suitable for scanned documents and images where there is no reliable digital text layer. Importantly, parsing happens before chunking, so information lost here will not magically reappear during retrieval."},{id:4,topic:"Chunking",points:1,context:[{type:"text",text:"An IT security guide contains:"},{type:"quote",text:"“After five failed sign-in attempts, the account is temporarily locked. Users must contact the IT Service Desk to restore access.”"}],question:"Which chunking approach is best?",options:R("Keep both sentences together as one coherent chunk","Put each sentence in unrelated chunks","Put the entire 150-page IT handbook into one chunk","Keep only the first sentence"),correctAnswer:"A",explanation:"The rule and its associated action belong together. Splitting connected information can cause retrieval to return an incomplete answer. Good chunking balances chunks that are too large against chunks that are too small."},{id:5,topic:"Embeddings",points:1,context:[{type:"text",text:"An employee asks:"},{type:"quote",text:"“My authentication code isn’t working.”"},{type:"text",text:"The knowledge base contains an article titled:"},{type:"quote",text:"“Troubleshooting multi-factor authentication failures”"}],question:"Why could semantic retrieval find this article even though the wording differs?",options:R("Both sentences contain exactly the same keywords","Embeddings can represent similar meaning with nearby vectors","The vector database rewrites the article","The LLM must have memorized the article"),correctAnswer:"B",explanation:"Embeddings capture semantic relationships. Different phrases can therefore be close in vector space when they express similar intent."},{id:6,topic:"Vector search and top-k",points:1,context:[{type:"text",text:"The correct troubleshooting article ranks #6 in the vector search."},{type:"text",text:"The retriever has: `top-k = 5`"}],question:"What happens?",options:R("Result #6 is automatically passed to the LLM","Result #6 may not reach the prompt at all","The LLM automatically changes top-k to 6","The embedding model generates the final answer"),correctAnswer:"B",explanation:"Top-k controls how many candidate chunks are returned. If k = 5, the sixth-ranked result will normally be excluded unless filtering, query optimisation, or reranking moves it into the top five."},{id:7,topic:"Retrieval quality",points:1,context:[{type:"text",text:"An employee asks:"},{type:"quote",text:"“How do I connect to the VPN from home?”"},{type:"text",text:"The system retrieves:"},{type:"list",items:["Result 1: VPN Setup Guide 2023","Result 2: VPN Setup Guide 2026","Result 3: Home Working Guide 2026"]},{type:"text",text:"The assistant answers using the outdated 2023 procedure."}],question:"Which improvement would BEST address this problem?",options:R("Increase the LLM temperature","Use metadata such as document status/effective date and reranking","Make the response longer","Fine-tune the LLM on writing style"),correctAnswer:"B",explanation:"Retrieval quality depends on more than semantic similarity. Metadata filters, freshness, reranking, recall, and precision are all retrieval-quality considerations that help the current 2026 guide outrank the outdated one."},{id:8,topic:"Query optimisation",points:1,context:[{type:"text",text:"An employee asks:"},{type:"quote",text:"“Compare the VPN access requirements for employees using managed laptops and personal devices.”"}],question:"Which query optimisation technique is the best starting point?",options:R("Query decomposition","Increase chunk overlap","OCR","Increase temperature"),correctAnswer:"A",explanation:"The question combines two separate information needs: requirements for managed laptops and requirements for personal devices. Query decomposition splits it into sub-questions so the retriever can find evidence for each before the answers are compared."},{id:9,topic:"Diagnose the RAG failure",points:1,context:[{type:"text",text:"An employee asks how to fix a VPN error. The system:"},{type:"list",items:["Parsed the document correctly","Created suitable chunks","Retrieved the correct current troubleshooting chunk","Passed that chunk into the prompt"]},{type:"text",text:"The chunk says:"},{type:"quote",text:"“Do not reinstall SecureConnect without IT approval.”"},{type:"text",text:"But the LLM answers:"},{type:"quote",text:"“Uninstall and reinstall SecureConnect.”"}],question:"Where is the most likely failure?",options:R("Parsing","Chunking","Retrieval","Prompting/generation"),correctAnswer:"D",explanation:"In this case, the right information successfully reached the model, but the generated response contradicted that evidence. The prompt/generation stage therefore needs investigation. RAG failures can come from a bad source, parsing, chunking, retrieval, prompting, or security."},{id:10,topic:"LangChain: put everything together",points:1,context:[{type:"text",text:"You already have documents stored in a vector store."}],question:"Which LangChain component is primarily responsible for returning the relevant chunks for a user’s question?",options:R("`StrOutputParser`","`as_retriever()`","`ChatPromptTemplate`","`PyPDFLoader`"),correctAnswer:"B",explanation:'In the example query chain, `vector_store.as_retriever(search_kwargs={"k": 4})` creates the retriever that returns the top-k relevant chunks. `ChatPromptTemplate` then augments the request with context, and the LLM generates the response.'}];function _t(e){return e.reduce((t,n)=>t+n.points,0)}function Lt(e){return e>=9?{title:"RAG Architect",feedback:"Excellent. You can design, retrieve, and ground answers like a seasoned RAG architect."}:e>=7?{title:"Retrieval Pro",feedback:"Strong work. You understand the pipeline well; review the questions you missed to sharpen the details."}:e>=5?{title:"RAG Builder",feedback:"Solid foundation. Revisit metadata, top-k, and failure diagnosis to move up a level."}:e>=3?{title:"RAG Apprentice",feedback:"A good start. Review indexing, retrieval, and grounding, then try again."}:{title:"Time to Re-index",feedback:"Every expert starts somewhere. Review the explanations below and take the challenge again."}}function ze(e,t){let n=0,r=0;for(const _ of e)t[_.id]===_.correctAnswer&&(n+=_.points,r+=1);const s=_t(e),{title:i,feedback:c}=Lt(n);return{points:n,maxPoints:s,correctCount:r,totalQuestions:e.length,percentage:Math.round(n/s*100),title:i,feedback:c}}const ke="rag-architect-challenge:v2",S=q.length,Mt=_t(q),te={screen:"welcome",current:0,answers:{},submitted:!1};function Et(){var e;try{const t=sessionStorage.getItem(ke);if(!t)return te;const n=JSON.parse(t);if(!["welcome","quiz","review","results","answers"].includes(n.screen))return te;const s=Number.isInteger(n.current)&&n.current>=0&&n.current
